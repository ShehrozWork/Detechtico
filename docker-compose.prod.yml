name: detechtico_v2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detechtico
      POSTGRES_PASSWORD: a7Xk9Mw2PqL5Rz8Nf3Yc
      POSTGRES_DB: detechtico
    volumes:
      - detechtico_v2_pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detechtico -d detechtico"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      ADMIN_DATABASE_URL: postgresql://detechtico:a7Xk9Mw2PqL5Rz8Nf3Yc@db:5432/detechtico
      DATABASE_URL: postgresql://detechtico_app:B4jH6Vt9Km3Zp2Wx7NqC@db:5432/detechtico
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: https://detechtico.vercel.app
    # Public so Vercel rewrites can reach the API. Old stack stays on 8210.
    ports:
      - "8211:8000"
    volumes:
      - detechtico_v2_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  detechtico_v2_pgdata:
  detechtico_v2_uploads:
