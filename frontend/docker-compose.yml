services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detechtico
      POSTGRES_PASSWORD: detechtico_dev_only
      POSTGRES_DB: detechtico
    ports:
      - "5435:5432"
    volumes:
      - detechtico_pgdata:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detechtico -d detechtico"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://detechtico_app:detechtico_app_dev_only@db:5432/detechtico
      ADMIN_DATABASE_URL: postgresql://detechtico:detechtico_dev_only@db:5432/detechtico
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  detechtico_pgdata:
